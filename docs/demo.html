    else if (name === "schedule-add") showForm("\uC0C8 \uC77C\uC815 \uCD94\uAC00", "schedule-add", dateField() + field("\uC77C\uC815 \uC81C\uBAA9", "title", "", "text", 'required maxlength="100"') + `<label class="field">\uC77C\uC815 \uC885\uB958<select name="kind">${Object.entries(kindNames).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><small>\uC2DD\uC0AC\xB7\uCE74\uD398\uB97C \uC120\uD0DD\uD558\uBA74 \uD22C\uD45C\uB3C4 \uD568\uAED8 \uB9CC\uB4E4\uC5B4\uC694.</small></label>` + textarea("\uC124\uBA85", "description", "", 1e3));
    else if (name === "lodging-edit") {
      const l = state.data.lodgings.find((l2) => l2.id === id);
      showForm("\uC219\uC18C \uC815\uBCF4 \uC218\uC815", "lodging", field("\uC219\uC18C \uC774\uB984", "name", l.name, "text", 'required maxlength="100"') + field("\uC219\uC18C \uB9C1\uD06C", "url", l.url, "url", "required") + textarea("\uC608\uC57D \uC0C1\uD0DC\xB7\uC8FC\uC18C\xB7\uC785\uD1F4\uC2E4 \uC548\uB0B4", "notes", l.notes, 1e3) + check("\uC219\uC18C \uC815\uBCF4 \uD655\uC778 \uC644\uB8CC", "verified", l.verified), id);
    } else if (name === "participant-edit") {
      const p = state.data.participants.find((p2) => p2.id === id);
      showForm("\uCC38\uC5EC\uC790 \uC218\uC815", "participant", field("\uC774\uB984", "name", p.name, "text", 'required maxlength="40"') + '<p class="muted">\uB2E4\uB978 \uCE5C\uAD6C\uC758 \uC774\uB984\uC740 \uD574\uB2F9 \uCE5C\uAD6C\uAC00 \uBCC0\uACBD\uD560 \uC218 \uC788\uC5B4\uC694.</p>', id);
    } else if (name === "participant-add") showForm("\uCE5C\uAD6C \uCD94\uAC00", "participant-add", field("\uC774\uB984", "name", "", "text", 'required maxlength="40"'));
    else if (name === "invite") showForm("\uCE5C\uAD6C\uBCC4 \uCD08\uB300 \uB9C1\uD06C \uBC1C\uAE09", "invite", `<p class="dialog-description">${escapeHtml(state.data.participants.find((p) => p.id === id).name)} \uB2D8\uC758 \uB85C\uADF8\uC778 \uB9C1\uD06C\uB97C \uB9CC\uB4E4\uC5B4\uC694. \uC7AC\uBC1C\uAE09 \uC2DC \uC774\uC804 \uB9C1\uD06C\uC640 \uC5F0\uACB0\uB41C \uC811\uC18D \uAD8C\uD55C\uC774 \uC885\uB8CC\uB3FC\uC694.</p>${field("\uB9CC\uB8CC \uC77C\uC2DC (\uC120\uD0DD, \uD55C\uAD6D \uC2DC\uAC04)", "expires_at", "", "datetime-local")}`, id, "\uB9C1\uD06C \uBC1C\uAE09");
    else if (name === "revoke-invite") confirmAction("\uCD08\uB300 \uB9C1\uD06C \uD3D0\uAE30", "\uC774 \uCE5C\uAD6C\uC758 \uAE30\uC874 \uB9C1\uD06C\uC640 \uC5F0\uACB0\uB41C \uC811\uC18D \uAD8C\uD55C\uC774 \uC885\uB8CC\uB3FC\uC694. \uD544\uC694\uD558\uBA74 \uC0C8 \uB9C1\uD06C\uB97C \uBC1C\uAE09\uD560 \uC218 \uC788\uC5B4\uC694.", "revoke_invite", id, { id });
    else if (name === "expense-add") expenseForm();
    else if (name === "expense-edit") expenseForm(state.data.expenses.find((x) => x.id === id));
    else if (name === "expense-delete") confirmAction("\uACB0\uC81C \uB0B4\uC5ED \uC0AD\uC81C", "\uC774 \uB0B4\uC5ED\uACFC \uBC30\uBD84 \uAE08\uC561\uC744 \uC815\uC0B0\uC5D0\uC11C \uC81C\uC678\uD560\uAE4C\uC694?", "expense_delete", id, { id });
    else if (name === "guest-edit") {
      const entry = state.entries.find((x) => x.id === id);
      showForm("\uBA54\uC2DC\uC9C0 \uC218\uC815", "guest-edit", textarea("\uBA54\uC2DC\uC9C0", "content", entry.content, 1e3), id);
    } else if (name === "guest-delete") confirmAction("\uBA54\uC2DC\uC9C0 \uC0AD\uC81C", "\uC774 \uBA54\uC2DC\uC9C0\uB97C \uC0AD\uC81C\uD560\uAE4C\uC694?", "guestbook_delete", id, { id });
    else if (name === "guest-more") {
      state.limit += 20;
      await refresh();
    } else if (name === "demo-reset") {
      showDialog("\uB370\uBAA8 \uCD08\uAE30\uD654", `<p class="dialog-description">\uC774 \uBE0C\uB77C\uC6B0\uC800\uC5D0\uC11C \uCD94\uAC00\uD55C \uD6C4\uBCF4\xB7\uD45C\xB7\uBA54\uC2DC\uC9C0\uB97C \uCD08\uAE30\uD654\uD574\uC694.</p><form data-form="reset">${formEnd("\uCD08\uAE30\uD654")}</form>`);
    } else if (name === "export") {
      if (!canEdit()) throw new Error("\uBA3C\uC800 \uC5EC\uD589\uC5D0 \uCC38\uC5EC\uD574 \uC8FC\uC138\uC694.");
      const entries = await state.repo.guestbook(1e4);
      const snapshot = { ...state.data, guestbook: entries };
      delete snapshot.invitations;
      const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = "yeosu-suncheon-records.json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1e3);
      toast("\uAE30\uB85D\uC744 \uB0B4\uB824\uBC1B\uC558\uC5B4\uC694.");
    } else if (name === "copy-link") {
      const value = $("#issued-link").textContent;
      try {
        await navigator.clipboard.writeText(value);
        toast("\uB9C1\uD06C\uB97C \uBCF5\uC0AC\uD588\uC5B4\uC694.");
      } catch {
        toast("\uB9C1\uD06C\uB97C \uC120\uD0DD\uD574\uC11C \uBCF5\uC0AC\uD574 \uC8FC\uC138\uC694.");
      }
    }
  }
  document.addEventListener("click", async (event) => {
    const el = event.target.closest("[data-action]");
    if (!el || el.disabled) return;
    event.preventDefault();
    if (state.busy) return;
    lockUi(true);
    try {
      await action(el.dataset.action, el.dataset.id, el);
    } catch (error) {
      toast(error.message);
    } finally {
      lockUi(false);
    }
  });
  document.addEventListener("submit", async (event) => {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    if (state.busy) return;
    lockUi(true);
    const submit = form.querySelector("[type=submit]");
    form.querySelector(".form-error").textContent = "";
    const values = Object.fromEntries(new FormData(form)), id = form.dataset.id, type = form.dataset.form;
    try {
      if (!canEdit()) throw new Error("\uCE5C\uAD6C\uBCC4 \uCD08\uB300 \uB9C1\uD06C\uB85C \uBA3C\uC800 \uC785\uC7A5\uD574 \uC8FC\uC138\uC694.");
      let result;
      if (type === "candidate") {
        result = await write("candidate", { ...validateCandidate(values), poll_id: id });
      } else if (type === "confirmation") await write(form.dataset.actionName, JSON.parse(form.dataset.extra));
      else if (type === "schedule-edit") await write("schedule", { ...values, id, verified: values.verified === "on" });
      else if (type === "schedule-add") await write("schedule_add", values);
      else if (type === "lodging") await write("lodging", { ...values, id, verified: values.verified === "on" });
      else if (type === "participant") await write("participant", { ...values, id });
      else if (type === "participant-add") await write("participant_add", values);
      else if (type === "invite") {
        result = await write("invite", { id, expires_at: fromKst(values.expires_at) });
        const issuedUrl = new URL(location.href);
        issuedUrl.search = "";
        issuedUrl.hash = `invite=${result.token}`;
        const invitationUrl = issuedUrl.href;
        showDialog("\uCD08\uB300 \uB9C1\uD06C\uAC00 \uC900\uBE44\uB410\uC5B4\uC694", `<p class="dialog-description">${state.repo.demo ? "\uB370\uBAA8 \uB9C1\uD06C\uC608\uC694. \uC2E4\uC81C \uCE5C\uAD6C \uCD08\uB300\uC5D0\uB294 \uC0AC\uC6A9\uD560 \uC218 \uC5C6\uC5B4\uC694." : "\uB9C1\uD06C\uB294 \uC9C0\uAE08\uB9CC \uD45C\uC2DC\uB3FC\uC694. \uD574\uB2F9 \uCE5C\uAD6C\uC5D0\uAC8C \uC804\uB2EC\uD560 \uC218 \uC788\uB3C4\uB85D \uBCF5\uC0AC\uD574 \uB450\uC138\uC694."}</p><p id="issued-link" class="notice invite-link">${escapeHtml(invitationUrl)}</p>${button("\uB9C1\uD06C \uBCF5\uC0AC", "copy-link", "", "primary")}`);
        return;
      } else if (["expense-create", "expense-edit"].includes(type)) {
        const input = validateExpense({ ...values, occurred_at: fromKst(`${values.expense_date}T${values.expense_time}`), participant_ids: new FormData(form).getAll("participant_ids") }, state.data.participants);
        await write(type === "expense-create" ? "expense_create" : "expense_edit", { ...input, id, request_id: form.dataset.requestId });
      } else if (type === "guestbook-create") {
        const content = validateMessage(values.content);
        await write("guestbook_create", { content, request_id: state.requestId });
        state.guestDraft = "";
        state.requestId = newId();
        const input = $("#guest-content");
        if (input) input.value = "";
        render();
      } else if (type === "guest-edit") await write("guestbook_edit", { id, content: validateMessage(values.content) });
      else if (type === "reset") {
        await state.repo.reset();
        state.section = "schedule";
        await refresh();
      }
      $("#dialog").close();
      toast(state.repo.demo ? "\uB370\uBAA8\uC5D0 \uC800\uC7A5\uD588\uC5B4\uC694." : "\uC800\uC7A5\uD588\uC5B4\uC694.");
    } catch (error) {
      if (form.isConnected) form.querySelector(".form-error").textContent = error.message;
      else toast(error.message);
    } finally {
      lockUi(false);
    }
  });
  document.addEventListener("input", (event) => {
    if (event.target.id === "guest-content") state.guestDraft = event.target.value;
  });
  document.addEventListener("change", async (event) => {
    if (event.target.name === "split_mode") {
      const box = $("#split-people");
      if (box) box.hidden = event.target.value !== "some";
    }
    if (event.target.id === "demo-person") {
      await state.repo.selectParticipant(event.target.value);
      state.guestDraft = "";
      state.pollId = null;
      state.requestId = newId();
      await refresh();
    }
  });
  window.addEventListener("hashchange", () => {
    const target = location.hash.slice(1);
    if (["schedule", "votes", "lodgings", "budget", "guestbook", "settings"].includes(target)) {
      state.section = target;
      state.pollId = null;
      render();
    }
  });
  window.addEventListener("online", () => {
    toast("\uC5F0\uACB0\uC774 \uBCF5\uAD6C\uB410\uC5B4\uC694.");
    refresh();
  });
  window.addEventListener("offline", () => {
    renderConnection();
    toast("\uC624\uD504\uB77C\uC778\uC774\uC5D0\uC694. \uC791\uC131 \uC911\uC778 \uB0B4\uC6A9\uC740 \uC720\uC9C0\uB3FC\uC694.");
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh();
  });
  async function start() {
    try {
      const config = window.TRIP_CONFIG || {};
      const hasUrl = Boolean(config.supabaseUrl), hasKey = Boolean(config.supabaseKey);
      const target = location.hash.slice(1);
      if (["schedule", "votes", "lodgings", "budget", "guestbook", "settings"].includes(target)) state.section = target;
      if (hasUrl || hasKey) {
        showPublicPreview();
        render();
      }
      if (hasUrl !== hasKey) throw new Error("\uC11C\uBE44\uC2A4 \uC124\uC815\uC774 \uC77C\uBD80\uB9CC \uC785\uB825\uB418\uC5B4 \uC788\uC5B4\uC694. URL\uACFC \uACF5\uAC1C \uD0A4\uB97C \uBAA8\uB450 \uC124\uC815\uD574 \uC8FC\uC138\uC694.");
      state.repo = hasUrl ? await SupabaseRepository.create(config) : new DemoRepository();
      if (inviteToken && state.repo.demo) {
        state.error = "\uB370\uBAA8\uC5D0\uC11C\uB294 \uC2E4\uC81C \uCD08\uB300 \uB9C1\uD06C \uC778\uC99D\uC744 \uC0AC\uC6A9\uD560 \uC218 \uC5C6\uC5B4\uC694.";
        inviteToken = null;
        toast(state.error);
      }
      if (inviteToken) {
        await state.repo.redeem(inviteToken);
        inviteToken = null;
      }
      await refresh();
      if (canEdit() && !state.unsubscribe) subscribe();
      expiryTimer = setInterval(() => {
        if (document.visibilityState === "visible") refresh();
      }, 3e4);
    } catch (error) {
      state.error = error.message;
      showPublicPreview();
      render();
    }
  }
  window.addEventListener("pagehide", (event) => {
    if (!event.persisted) {
      clearInterval(expiryTimer);
      state.unsubscribe?.();
    }
  });
  start();
})();
